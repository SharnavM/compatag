[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"


[project]
name = "compatag"
version = "0.1.0.dev0"
description = "Preflight Python package compatibility across Python versions and platforms."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "httpx>=0.28,<1",
    "mcp>=2.2,<3",
    "packaging>=26.3,<27",
    "pydantic>=2.13,<3",
]


[project.optional-dependencies]
dev = [
    "build>=1.6",
    "mypy>=2.3",
    "pytest>=9.1",
    "pytest-asyncio>=1.4,<2",
    "pytest-cov>=7.1",
    "ruff>=0.16.5",
    "twine>=7.0",
]


[project.scripts]
compatag = "compatag.cli:main"
compatag-mcp = "compatag.mcp_server:main"

[project.urls]
Homepage = "https://github.com/SharnavM/compatag"
Repository = "https://github.com/SharnavM/compatag"
Issues = "https://github.com/SharnavM/compatag/issues"


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]
asyncio_mode = "strict"


[tool.coverage.run]
branch = true
source = ["compatag"]


[tool.coverage.report]
show_missing = true
skip_covered = true


[tool.ruff]
target-version = "py311"
line-length = 100


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]


[tool.mypy]
python_version = "3.11"
strict = true
pretty = true
show_error_codes = true