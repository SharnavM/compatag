name: Release

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Check dependencies
        run: python -m pip check

      - name: Run tests
        run: python -m pytest

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff formatting
        run: python -m ruff format --check .

      - name: Mypy
        run: python -m mypy src

  build:
    name: Build release distributions
    needs:
      - verify

    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}

    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install release tools
        run: >-
          python -m pip install
          --upgrade
          build
          packaging
          twine

      - name: Verify release tag and version
        run: |
          python - <<'PY'
          import os
          import tomllib
          from packaging.version import Version

          with open("pyproject.toml", "rb") as handle:
              project = tomllib.load(handle)["project"]

          version = Version(project["version"])
          release_tag = os.environ["RELEASE_TAG"]
          expected_tag = f"v{version}"

          if release_tag != expected_tag:
              raise SystemExit(
                  f"release tag {release_tag!r} does not match "
                  f"project version {version!s}; expected {expected_tag!r}"
              )

          if version.is_devrelease:
              raise SystemExit(
                  f"development version {version!s} cannot be "
                  "published through the release workflow"
              )

          print(f"Release version verified: {version}")
          PY

      - name: Build wheel and source distribution
        run: python -m build

      - name: Verify distribution contents
        run: python scripts/verify_release_artifacts.py

      - name: Validate package metadata
        run: python -m twine check --strict dist/*

      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/compatag-wheel
          /tmp/compatag-wheel/bin/python -m pip install --upgrade pip
          /tmp/compatag-wheel/bin/python -m pip install dist/*.whl
          /tmp/compatag-wheel/bin/python -m pip check
          /tmp/compatag-wheel/bin/compatag --version
          /tmp/compatag-wheel/bin/python -c "from compatag.mcp_server import mcp; print(mcp.name)"
          test -x /tmp/compatag-wheel/bin/compatag-mcp

      - name: Install source distribution in a clean environment
        run: |
          python -m venv /tmp/compatag-sdist
          /tmp/compatag-sdist/bin/python -m pip install --upgrade pip
          /tmp/compatag-sdist/bin/python -m pip install dist/*.tar.gz
          /tmp/compatag-sdist/bin/python -m pip check
          /tmp/compatag-sdist/bin/compatag --version
          /tmp/compatag-sdist/bin/python -c "from compatag.mcp_server import mcp; print(mcp.name)"
          test -x /tmp/compatag-sdist/bin/compatag-mcp

      - name: Store release distributions
        uses: actions/upload-artifact@v7
        with:
          name: compatag-release-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs:
      - build

    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: pypi
      url: https://pypi.org/project/compatag/

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download release distributions
        uses: actions/download-artifact@v7
        with:
          name: compatag-release-distributions
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          print-hash: true
